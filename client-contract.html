<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Contract — SN Web Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .contract-page {
      min-height: 100vh;
      background: var(--bg);
      padding: 48px 24px 80px;
    }
    .contract-header {
      max-width: 800px;
      margin: 0 auto 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .contract-header h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.75rem;
      font-weight: 400;
      color: var(--text);
    }
    .contract-card {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .contract-card h2 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--text);
    }
    .contract-card .step-desc {
      margin: 0 0 24px;
      font-size: 0.9375rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .contract-pdf-wrap {
      margin-bottom: 24px;
    }
    .contract-pdf-wrap iframe {
      width: 100%;
      height: 500px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .contract-signed {
      padding: 16px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: var(--radius);
      color: #16a34a;
      font-size: 0.9375rem;
      margin-top: 16px;
    }
    .contract-loading, .contract-none {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .user-badge {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div class="contract-page">
    <div id="user-badge" class="user-badge" style="display: none;"></div>

    <div id="contract-content" style="display: none;">
      <div class="contract-header">
        <h1>Your Service Agreement</h1>
        <a href="client-dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
      </div>

      <div class="contract-card">
        <div id="contract-loading" class="contract-loading">
          <p>Loading your contract…</p>
        </div>
        <div id="contract-view" style="display: none;">
          <h2>Your Contract</h2>
          <p class="step-desc">Review your service agreement below. You can download a copy for your records.</p>
          <div class="contract-pdf-wrap">
            <iframe id="contract-iframe" title="Your contract"></iframe>
            <a id="contract-download" href="#" target="_blank" rel="noopener" class="btn btn-secondary" style="margin-top:12px;display:inline-block;">Download contract</a>
          </div>
          <div id="contract-sign-section" style="display: none;">
            <div style="margin: 24px 0;">
              <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;">
                <input type="checkbox" id="contract-agree" style="margin-top:4px;accent-color:var(--accent);" />
                <span>I have read and agree to the terms of this service agreement.</span>
              </label>
            </div>
            <button type="button" class="btn btn-primary" id="contract-sign-btn" disabled>Sign Contract</button>
          </div>
          <div id="contract-signed" class="contract-signed" style="display: none;">
            ✓ Signed on <span id="contract-signed-date"></span>
          </div>
        </div>
        <div id="contract-none" style="display: none;">
          <p class="step-desc">No contract has been assigned for your account yet. Please contact us if you need access.</p>
        </div>
      </div>
    </div>

    <div id="contract-loading-page" class="contract-loading">
      <p>Loading…</p>
    </div>
  </div>

  <script>
    (async function() {
      const loadingPageEl = document.getElementById('contract-loading-page');
      const contentEl = document.getElementById('contract-content');

      try {
        const res = await fetch('/api/config');
        const { clerkPublishableKey, clerkFrontendApi } = await res.json();
        if (!clerkPublishableKey) {
          loadingPageEl.innerHTML = '<p>Clerk is not configured. <a href="client-login.html">Go to login</a></p>';
          return;
        }

        const script = document.createElement('script');
        script.async = true;
        script.crossOrigin = 'anonymous';
        script.setAttribute('data-clerk-publishable-key', clerkPublishableKey);
        script.src = clerkFrontendApi
          ? 'https://' + clerkFrontendApi.replace(/^https?:\/\//, '') + '/npm/@clerk/clerk-js@5/dist/clerk.browser.js'
          : 'https://clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
        script.type = 'text/javascript';
        document.head.appendChild(script);

        await new Promise(function(resolve) { script.onload = resolve; });

        await window.Clerk.load();
        if (!window.Clerk.isSignedIn) {
          window.location.href = 'client-login.html?redirect=client-contract.html';
          return;
        }

        loadingPageEl.style.display = 'none';
        contentEl.style.display = 'block';

        const userButtonDiv = document.getElementById('user-badge');
        userButtonDiv.style.display = 'block';
        window.Clerk.mountUserButton(userButtonDiv);

        loadContract();
      } catch (err) {
        console.error(err);
        loadingPageEl.innerHTML = '<p>Unable to load. <a href="client-login.html">Try logging in again</a>.</p>';
      }
    })();

    async function loadContract() {
      const loadingEl = document.getElementById('contract-loading');
      const viewEl = document.getElementById('contract-view');
      const noneEl = document.getElementById('contract-none');
      loadingEl.style.display = 'block';
      viewEl.style.display = 'none';
      noneEl.style.display = 'none';
      try {
        const token = await window.Clerk.session.getToken();
        const res = await fetch('/api/contract', { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        loadingEl.style.display = 'none';
        if (data.ok && data.url) {
          viewEl.style.display = 'block';
          document.getElementById('contract-iframe').src = data.url;
          document.getElementById('contract-download').href = data.url;
          document.getElementById('contract-download').download = data.filename || 'contract.pdf';
          if (data.signedAt) {
            document.getElementById('contract-sign-section').style.display = 'none';
            document.getElementById('contract-signed').style.display = 'block';
            document.getElementById('contract-signed-date').textContent = new Date(data.signedAt).toLocaleDateString();
          } else {
            document.getElementById('contract-sign-section').style.display = 'block';
            document.getElementById('contract-signed').style.display = 'none';
          }
        } else {
          noneEl.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        loadingEl.style.display = 'none';
        noneEl.style.display = 'block';
      }
    }

    document.getElementById('contract-agree').addEventListener('change', function() {
      document.getElementById('contract-sign-btn').disabled = !this.checked;
    });

    document.getElementById('contract-sign-btn').addEventListener('click', async function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Signing…';
      try {
        const token = await window.Clerk.session.getToken();
        const res = await fetch('/api/contract/sign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById('contract-sign-section').style.display = 'none';
          document.getElementById('contract-signed').style.display = 'block';
          document.getElementById('contract-signed-date').textContent = new Date(data.signedAt).toLocaleDateString();
        } else {
          btn.disabled = false;
          btn.textContent = 'Sign Contract';
          alert(data.error || 'Signing failed');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Sign Contract';
        alert('Signing failed');
      }
    });
  </script>
</body>
</html>
